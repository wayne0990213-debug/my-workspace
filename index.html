<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一起操作的工作空間</title><style>
:root{font-family:system-ui,sans-serif;color:#1c2b32;background:#f4f6f3}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e0e8e2;padding:20px 7%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;color:#265d4f}.badge{font-size:12px;background:#e5f2e9;color:#287252;border-radius:20px;padding:7px 12px}main{max-width:1100px;margin:auto;padding:64px 24px}h1{font-size:clamp(32px,5vw,52px);margin:12px 0;letter-spacing:-.04em}.eyebrow{color:#39866c;font-size:13px;font-weight:800;letter-spacing:.16em}.intro{color:#60716e;line-height:1.8;max-width:650px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;margin-top:40px}.card{background:white;border:1px solid #e0e8e2;border-radius:20px;padding:28px;box-shadow:0 8px 30px #163d2710}h2{font-size:20px;margin:0 0 8px}.muted{color:#74827f;font-size:14px;line-height:1.7}.row{display:flex;gap:8px;margin:20px 0}input[type=text],textarea{font:inherit;border:1px solid #d6e2db;border-radius:10px;padding:12px;width:100%;outline-color:#3e9878}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 18px;background:#245f4d;color:white;white-space:nowrap}button:hover{background:#194b3d}.task{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #edf1ee}.task span{flex:1;overflow-wrap:anywhere}.task.done span{text-decoration:line-through;color:#99a5a0}.task button{background:#f1f5f2;color:#526a5e;padding:7px 10px}textarea{min-height:170px;resize:vertical;line-height:1.6}.hint{font-size:12px;color:#84918c}.empty{padding:20px 0;color:#98a7a0;font-size:14px}.steps{margin-top:24px;display:flex;gap:16px;flex-wrap:wrap;color:#6b8075;font-size:13px}.steps span{background:#e7eee9;border-radius:20px;padding:8px 13px}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding-top:42px}header{padding:16px 24px}}
</style></head><body><header><div class="brand">✳ 一起操作</div><div class="badge">公開網站</div></header><main><div class="eyebrow">YOUR SPACE, TOGETHER</div><h1>把想做的事，<br>放在這裡。</h1><p class="intro">這是一個簡單的互動空間。你可以自己新增待辦、記下想法，也可以在聊天中請我協助操作或修改這個網站。</p><div class="steps"><span>01 新增一件事</span><span>02 完成後打勾</span><span>03 記下你的想法</span></div><div class="grid"><section class="card"><h2>待辦清單</h2><div class="muted">從一件小事開始，完成後勾選即可。</div><form class="row" id="form"><input id="taskInput" type="text" maxlength="120" placeholder="例如：完成今天的作業" aria-label="新增待辦事項" required><button>新增</button></form><div id="tasks" aria-live="polite"></div></section><section class="card"><h2>隨手備忘</h2><p class="muted">把靈感、提醒或想跟我說的事情記下來。</p><textarea id="note" aria-label="備忘內容" placeholder="在這裡寫下你的想法……"></textarea><p class="hint">內容會自動儲存在目前使用的瀏覽器中。</p></section></div><p class="hint" style="margin-top:25px">小提醒：待辦與備忘只儲存在此瀏覽器，換裝置或清除瀏覽器資料後可能看不到。</p></main><script>
const key='together-tasks-v1',note=document.querySelector('#note'),list=document.querySelector('#tasks');let tasks=[];try{tasks=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(tasks))tasks=[]}catch{tasks=[]}function save(){localStorage.setItem(key,JSON.stringify(tasks));render()}function render(){list.replaceChildren();if(!tasks.length){let e=document.createElement('div');e.className='empty';e.textContent='目前沒有待辦事項，新增一項試試看。';list.append(e);return}tasks.forEach((t,i)=>{let row=document.createElement('div');row.className='task'+(t.done?' done':'');let cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.setAttribute('aria-label','標記完成：'+t.text);cb.onchange=()=>{tasks[i].done=cb.checked;save()};let s=document.createElement('span');s.textContent=t.text;let b=document.createElement('button');b.textContent='刪除';b.setAttribute('aria-label','刪除：'+t.text);b.onclick=()=>{tasks.splice(i,1);save()};row.append(cb,s,b);list.append(row)})}document.querySelector('#form').onsubmit=e=>{e.preventDefault();let inp=document.querySelector('#taskInput'),v=inp.value.trim();if(v){tasks.push({text:v,done:false});inp.value='';save()}};note.value=localStorage.getItem('together-note-v1')||'';note.oninput=()=>localStorage.setItem('together-note-v1',note.value);render();
</script></body></html>
